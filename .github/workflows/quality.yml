name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Check source and audit matrix
        run: bun run check

      - name: Build documentation
        run: bun run build

      - name: Restore visual baselines
        uses: actions/cache/restore@v4
        with:
          path: tests/.visual-baselines
          key: visual-${{ runner.os }}-main-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            visual-${{ runner.os }}-main-

      - name: Require a visual baseline on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -d tests/.visual-baselines ]; then
            echo "No visual baseline is available from main. Run the workflow on main first."
            exit 1
          fi

      - name: Run functional and accessibility tests
        run: bun run test:functional && bun run test:a11y

      - name: Compare visual snapshots
        if: github.event_name == 'pull_request'
        run: bun run test:visual

      - name: Refresh visual snapshots
        if: github.event_name == 'push'
        run: bun run test:visual:update

      - name: Save visual baselines
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: tests/.visual-baselines
          key: visual-${{ runner.os }}-main-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
